name: star-ci
description: Auto-detect what CI a repository needs and run it.
branding:
  icon: check-circle
  color: purple
inputs:
  path:
    description: Repository path to analyze and run CI for
    required: false
    default: '.'
runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: stable
    - name: Build star-ci
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        go build -o "${RUNNER_TEMP}/star-ci" ./cmd/star-ci
    - name: Run star-ci
      shell: bash
      run: |
        "${RUNNER_TEMP}/star-ci" run "${{ inputs.path }}"
